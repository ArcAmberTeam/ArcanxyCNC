; Commissioning template. Motion rates are initial settings; hardware calibration and HAL are required.
[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=XYZC

[TRAJ]
COORDINATES = XYZC
LINEAR_UNITS = mm
ANGULAR_UNITS = degree

[DISPLAY]
DISPLAY = betterlinuxcnc
GEOMETRY = XYZC

[BETTERCNC_HOMING]
MOTOR_MAPPING_VERIFIED = NO
MOTOR_DIRECTIONS_VERIFIED = NO

[AXIS_X]
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[AXIS_Y]
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[AXIS_Z]
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[AXIS_C]
MAX_VELOCITY = 1
MAX_ACCELERATION = 2

[JOINT_3]
TYPE = ANGULAR
MAX_VELOCITY = 1
MAX_ACCELERATION = 2
