; Commissioning template. Motion rates are initial settings; hardware calibration and HAL are required.
[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree

[DISPLAY]
DISPLAY = betterlinuxcnc
GEOMETRY = XYZ

[BETTERCNC_HOMING]
MOTOR_MAPPING_VERIFIED = NO
MOTOR_DIRECTIONS_VERIFIED = NO

[AXIS_X]
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[AXIS_Y]
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[AXIS_Z]
MAX_VELOCITY = 5
MAX_ACCELERATION = 50

[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 5
MAX_ACCELERATION = 50
