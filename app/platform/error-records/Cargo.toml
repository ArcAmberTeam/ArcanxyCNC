[package]
name = "betterlinuxcnc-error-records"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "GPL-2.0-or-later"

[workspace]
members = ["client"]

[dependencies]
betterlinuxcnc-error-client = { path = "client" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
mysql = { version = "26.0.1", default-features = false, features = ["minimal-rust"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
