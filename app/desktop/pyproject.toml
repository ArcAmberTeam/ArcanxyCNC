[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "betterlinuxcnc-qt"
version = "26.11.04.7"
description = "QML desktop with a private Unix socket connection to LinuxCNC"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.8,<7", "betterlinuxcnc-error-records==0.1.0"]

[project.scripts]
betterlinuxcnc = "bettercnc.desktop:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
