[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "betterlinuxcnc-session"
version = "26.11.21.1"
description = "Headless Unix status client for BetterLinuxCNC"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
betterlinuxcnc-status = "bettercnc.session:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
