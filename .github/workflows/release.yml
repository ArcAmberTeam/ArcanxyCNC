name: ArcAmberCNC Release

on:
  workflow_run:
    workflows: [ArcAmberCNC Module CI]
    branches: [main]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Already merged main PR with a -release application version
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve a release version, merged PR and successful CI artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.candidate.outputs.ready }}
      sha: ${{ steps.candidate.outputs.sha }}
      run-id: ${{ steps.candidate.outputs.run-id }}
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
      version: ${{ steps.candidate.outputs.version }}
      pr: ${{ steps.candidate.outputs.pr }}
    steps:
      # Never check out or run PR code in this privileged event workflow.
      - uses: actions/github-script@v8
        id: candidate
        with:
          script: |
            const repo = context.repo;
            let sha;
            let candidates;
            if (context.eventName === 'pull_request_target' || context.eventName === 'workflow_dispatch') {
              let number = context.payload.pull_request?.number;
              if (context.eventName === 'workflow_dispatch') {
                if (context.ref !== 'refs/heads/main') throw new Error('Release retries must run from main');
                const input = context.payload.inputs?.pr_number;
                if (!/^[1-9][0-9]{0,9}$/.test(input || '')) throw new Error('Expected a merged PR number');
                number = Number(input);
              }
              const {data: pr} = await github.rest.pulls.get({...repo, pull_number: number});
              if (!pr.merged || pr.base.ref !== 'main') return;
              sha = pr.merge_commit_sha;
              candidates = [pr];
            } else {
              const eventRun = context.payload.workflow_run;
              if (eventRun.event !== 'push' || eventRun.head_branch !== 'main' || eventRun.conclusion !== 'success') return;
              sha = eventRun.head_sha;
              const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {...repo, commit_sha: sha, per_page: 100});
              candidates = await Promise.all(associated.map(async item => (await github.rest.pulls.get({...repo, pull_number: item.number})).data));
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid merge commit');
            const eligible = candidates.filter(pr => pr.merged && pr.base.ref === 'main' && pr.base.repo.full_name === `${repo.owner}/${repo.repo}` && pr.merge_commit_sha === sha);
            if (eligible.length !== 1) return;
            const pr = eligible[0];
            async function readVersion(ref) {
              let data;
              try { ({data} = await github.rest.repos.getContent({...repo, path: 'versions/version.json', ref})); }
              catch (error) { if (error.status === 404) return null; throw error; }
              const manifest = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              if (manifest.schema_version !== 1 || typeof manifest.version !== 'string' || !/^\d+\.\d+\.\d+\.\d+-(dev|release)$/.test(manifest.version)) throw new Error('Invalid application version manifest');
              return manifest.version;
            }
            const declaredVersion = await readVersion(sha);
            if (!declaredVersion?.endsWith('-release')) return;
            const version = declaredVersion.slice(0, -'-release'.length);
            // Retry the original commit, but never republish this version from a later commit.
            try {
              let object = (await github.rest.git.getRef({...repo, ref: `tags/v${version}`})).data.object;
              for (let depth = 0; object.type === 'tag' && depth < 8; depth++) object = (await github.rest.git.getTag({...repo, tag_sha: object.sha})).data.object;
              if (object.type !== 'commit') throw new Error('Release tag does not resolve to a commit');
              if (object.sha !== sha) { core.info('This version already belongs to another commit; increment the version to publish again.'); return; }
            } catch (error) { if (error.status !== 404) throw error; }
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${sha}...main`});
            if (!['ahead', 'identical'].includes(comparison.status)) throw new Error('Release commit is not on main');
            const {data: workflow} = await github.rest.actions.getWorkflow({...repo, workflow_id: 'ci.yml'});
            const {data: runs} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: workflow.id, branch: 'main', event: 'push', head_sha: sha, per_page: 100});
            const run = runs.workflow_runs.find(item => item.head_sha === sha && item.head_branch === 'main' && item.event === 'push' && item.status === 'completed' && item.conclusion === 'success');
            // A later workflow_run event retries automatically when CI is still running.
            if (!run) { core.info('Waiting for the main push CI run to succeed.'); return; }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id: run.id, filter: 'latest', per_page: 100});
            if (!jobs.some(job => job.name === 'CI Gate' && job.conclusion === 'success')) throw new Error('CI Gate did not pass');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id: run.id, per_page: 100});
            const matches = artifacts.filter(item => !item.expired && item.name === `betterlinuxcnc-deb-${sha}`);
            if (matches.length !== 1) throw new Error('Expected exactly one verified DEB artifact');
            const {data: metadata} = await github.rest.repos.getContent({...repo, path: 'app/desktop/pyproject.toml', ref: sha});
            const match = Buffer.from(metadata.content, 'base64').toString('utf8').match(/^version\s*=\s*"(\d+\.\d+\.\d+\.\d+)"\s*$/m);
            if (!match) throw new Error('Expected a four-part application release version');
            if (match[1] !== version) throw new Error('JSON version differs from the application package version');
            core.setOutput('ready', 'true');
            core.setOutput('sha', sha);
            core.setOutput('run-id', String(run.id));
            core.setOutput('artifact-id', String(matches[0].id));
            core.setOutput('version', version);
            core.setOutput('pr', String(pr.number));

  publish:
    name: Publish the verified DEB as the latest formal Release
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact-id }}
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ github.token }}
          path: release-artifact
      - uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_PR: ${{ needs.resolve.outputs.pr }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const {execFileSync} = require('node:child_process');
            const repo = context.repo;
            const sha = process.env.RELEASE_SHA;
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            const name = `betterlinuxcnc_${version}_amd64.deb`;
            const bridge = `betterlinuxcnc-qt_${version}_amd64.deb`;
            const root = 'release-artifact';
            const archiveNames = ['source', 'integration'].map(kind => `cnc-mesa-${kind}-${version}.tar.gz`);
            const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            function verifyMesaRelease() {
              const bytes = fs.readFileSync(`${root}/mesa-release.json`);
              if (bytes.length < 1 || bytes.length > 65536) throw new Error('Invalid Mesa manifest size');
              const manifest = JSON.parse(bytes);
              if (manifest.schema_version !== 1 || manifest.version !== version || manifest.tag_name !== tag || manifest.source_commit !== sha || manifest.compatible_app_version !== version) throw new Error('Mesa manifest must match the application version and merge commit');
              if (manifest.board !== 'zhulong-v2' || manifest.variant !== 'PIN_ZHULONG_V2_34' || manifest.fpga !== 'xc6slx9' || manifest.package !== 'tqg144' || manifest.physical_constraints_verified !== false) throw new Error('Unexpected Mesa board identity or verification');
              const fw = manifest.firmware;
              if (fw?.available !== false || fw.origin !== 'unavailable' || !['asset', 'size', 'sha256'].every(key => fw[key] === null) || !['implementation', 'timing', 'board_approved'].every(key => fw.verification?.[key] === false)) throw new Error('Source-only Mesa release cannot claim verified firmware');
              const assets = new Map([['mesa-release.json', bytes]]);
              for (const kind of ['source', 'integration']) {
                const filename = `cnc-mesa-${kind}-${version}.tar.gz`;
                const record = manifest.artifacts?.[kind];
                const archive = fs.readFileSync(`${root}/${filename}`);
                if (!record || record.asset !== filename || archive.length === 0 || record.size_bytes !== archive.length || record.sha256 !== digest(archive)) throw new Error(`Invalid Mesa ${kind} archive`);
                assets.set(filename, archive);
              }
              const identity = {repository: `${repo.owner}/${repo.repo}`, tag, source_commit: sha};
              const evidence = {schema_version: 1, app: identity, mesa: {...identity, manifest_asset: 'mesa-release.json', manifest_sha256: digest(bytes), firmware_available: false}};
              assets.set('CNC_MESA_PAIR.json', Buffer.from(JSON.stringify(evidence, null, 2) + '\n'));
              return assets;
            }
            try {
              const {data: latest} = await github.rest.repos.getLatestRelease(repo);
              if (latest.tag_name !== tag) {
                if (!/^v\d+\.\d+\.\d+\.\d+$/.test(latest.tag_name)) throw new Error('Cannot compare existing latest release version');
                execFileSync('dpkg', ['--compare-versions', version, 'gt', latest.tag_name.slice(1)]);
              }
            } catch (error) { if (error.status !== 404) throw error; }
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: Number(process.env.RELEASE_PR)});
            if (!pr.merged || pr.base.ref !== 'main' || pr.base.repo.full_name !== `${repo.owner}/${repo.repo}` || pr.merge_commit_sha !== sha) throw new Error('Release authorization changed');
            const {data: versionFile} = await github.rest.repos.getContent({...repo, path: 'versions/version.json', ref: sha});
            const versionManifest = JSON.parse(Buffer.from(versionFile.content, 'base64').toString('utf8'));
            if (versionManifest.schema_version !== 1 || versionManifest.version !== `${version}-release`) throw new Error('Release version authorization changed');
            const files = fs.readdirSync(root).sort();
            if (JSON.stringify(files) !== JSON.stringify(['SHA256SUMS', 'SOURCE_COMMIT', name, bridge, 'mesa-release.json', ...archiveNames].sort())) throw new Error('Unexpected artifact files');
            for (const file of files) if (!fs.lstatSync(`${root}/${file}`).isFile()) throw new Error('Artifact must contain only regular files');
            if (fs.readFileSync(`${root}/SOURCE_COMMIT`, 'utf8').trim() !== sha) throw new Error('Artifact commit mismatch');
            const data = fs.readFileSync(`${root}/${name}`);
            const bridgeData = fs.readFileSync(`${root}/${bridge}`);
            const sums = [];
            for (const [filename, bytes, packageName] of [[name, data, 'betterlinuxcnc'], [bridge, bridgeData, 'betterlinuxcnc-qt']]) {
              sums.push([filename, crypto.createHash('sha256').update(bytes).digest('hex')]);
              for (const [field, expected] of Object.entries({Package: packageName, Version: version, Architecture: 'amd64'})) {
                const actual = execFileSync('dpkg-deb', ['--field', `${root}/${filename}`, field], {encoding: 'utf8'}).trim();
                if (actual !== expected) throw new Error(`Package ${field} mismatch in ${filename}`);
              }
            }
            const checksumLines = fs.readFileSync(`${root}/SHA256SUMS`, 'utf8').trimEnd().split('\n').sort();
            if (JSON.stringify(checksumLines) !== JSON.stringify(sums.map(([file, hash]) => `${hash}  ${file}`).sort())) throw new Error('Package checksum mismatch');
            const assets = verifyMesaRelease();
            assets.set(name, data);
            assets.set(bridge, bridgeData);
            const checksums = Array.from(assets, ([file, bytes]) => `${digest(bytes)}  ${file}`).sort();
            assets.set('SHA256SUMS', Buffer.from(checksums.join('\n') + '\n'));
            try {
              const {data: reference} = await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              let object = reference.object;
              while (object.type === 'tag') object = (await github.rest.git.getTag({...repo, tag_sha: object.sha})).data.object;
              if (object.type !== 'commit' || object.sha !== sha) throw new Error('Existing tag points to another commit');
            } catch (error) { if (error.status !== 404) throw error; }
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (!release) {
              release = (await github.rest.repos.createRelease({...repo, tag_name: tag, target_commitish: sha, name: `demo ${tag}`, draft: true, prerelease: false, body: `Built and installation-tested by GitHub CI from ${sha}.\n\nMerged PR #${pr.number}. New installations use \`${name}\`. Existing \`betterlinuxcnc-qt\` installations receive the compatibility package on their first update and \`betterlinuxcnc\` on their next update.\n\nThe Mesa FPGA sources and LinuxCNC integration archive are built from this same application revision. The manifest records their hashes. This source-only release contains no installable FPGA firmware.`})).data;
            }
            if (release.draft && release.target_commitish !== sha) throw new Error('Existing draft targets another commit');
            if (release.assets.some(asset => !assets.has(asset.name))) throw new Error('Unexpected existing release asset');
            for (const [assetName, content] of assets) {
              const existing = release.assets.find(asset => asset.name === assetName);
              const expected = `sha256:${crypto.createHash('sha256').update(content).digest('hex')}`;
              if (existing) {
                if (existing.digest !== expected) throw new Error(`Existing asset differs: ${assetName}`);
              } else {
                if (!release.draft) throw new Error('Refusing to add assets to an already published release');
                await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id, name: assetName, data: content, headers: {'content-type': 'application/octet-stream', 'content-length': content.length}});
              }
            }
            const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id: release.id, per_page: 100});
            if (uploaded.length !== assets.size || !Array.from(assets).every(([filename, bytes]) => uploaded.some(item => item.name === filename && item.state === 'uploaded' && item.size === bytes.length && item.digest === `sha256:${digest(bytes)}`))) throw new Error('Published assets differ from the verified CI bundle');
            if (!release.draft) {
              if (release.prerelease || release.name !== `demo ${tag}`) throw new Error('Existing release metadata differs');
              core.notice(`Release ${tag} already contains these verified assets; leaving it unchanged.`);
              return;
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, name: `demo ${tag}`, draft: false, prerelease: false, make_latest: 'true'});
            core.notice(`Published demo ${tag} from verified commit ${sha}`);
