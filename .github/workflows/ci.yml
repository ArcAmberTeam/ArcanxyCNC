name: ArcAmberCNC Module CI

on:
  push:
    branches: [main, staging测试环境, kihon]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Shell/Python - Source and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare source-check tools on the hosted runner
        run: bash .github/ci/setup-source-tools.sh
      - name: Check workflows, scripts and source boundaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/ci/check-source.sh

  native-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: hal
            name: C - HAL abstraction
          - module: motion
            name: C - Real-time motion control
          - module: drivers
            name: C/C++ - Hardware drivers
          - module: task
            name: C++ - LinuxCNC task layer
          - module: interpreter
            name: C++ - G-code interpreter
          - module: python-extensions
            name: C++ - Python extensions
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Prepare the native Debian 13 toolchain
        uses: docker/build-push-action@v7
        with:
          context: .github/ci/native
          platforms: linux/amd64
          tags: arcamber-native-ci:current
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,scope=native-debian13-amd64
          # Only one matrix child updates the shared dependency cache.
          cache-to: ${{ matrix.module == 'hal' && 'type=gha,scope=native-debian13-amd64,mode=max' || '' }}
      - name: Compile and verify this module without starting a controller
        env:
          NATIVE_MODULE: ${{ matrix.module }}
        run: |
          set -o pipefail
          mkdir -p native-logs
          docker run --rm --init --platform linux/amd64 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            arcamber-native-ci:current \
            bash .github/ci/native-check.sh "$NATIVE_MODULE" 2>&1 | tee "native-logs/$NATIVE_MODULE.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-${{ matrix.module }}-logs
          path: native-logs/
          if-no-files-found: ignore

  mesa-homing:
    name: C/VHDL - Pinned Mesa homing integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Prepare the native Debian 13 toolchain
        uses: docker/build-push-action@v7
        with:
          context: .github/ci/native
          platforms: linux/amd64
          tags: arcamber-native-ci:current
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,scope=native-debian13-amd64
      - name: Build the fixed module and verify public APIs, generated configuration and HDL
        run: |
          mkdir -p homing-artifacts
          docker run --rm --init --platform linux/amd64 \
            --env GITHUB_ACTIONS=true \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/homing-artifacts,dst=/output" \
            arcamber-native-ci:current \
            python3 tools/mesa-homing/build.py --source /workspace --output /output --integration-tests
      - uses: actions/upload-artifact@v7
        with:
          name: mesa-homing-${{ github.sha }}
          path: homing-artifacts/
          if-no-files-found: error

  python-checks:
    name: Python - Controller service (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/controller/requirements-ci.txt
      - name: Install pinned Python build and check tools
        run: python -m pip install -r app/controller/requirements-ci.txt
      - name: Check the installed service, controller and Unix socket protocol
        run: bash .github/ci/python-check.sh service

  preview-checks:
    name: Python - Preview adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test the installed preview adapter with Debian's real G-code extension
        run: |
          docker run --rm --init --platform linux/amd64 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace debian:13-slim \
            bash .github/ci/preview-check.sh

  launcher-checks:
    name: Python - Launcher orchestration (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/controller/requirements-ci.txt
      - name: Install pinned build and check tools
        run: python -m pip install -r app/controller/requirements-ci.txt
      - name: Install Rust for the staged system-service installation
        run: |
          for module in app/platform/cam-link app/platform/updater app/platform/mesa-update app/platform/manage-ini app/platform/account-management/cnc-maint; do
            version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["toolchain"]["channel"])' "$module/rust-toolchain.toml")
            # Both crate manifests request these components; preinstall them before parallel builds.
            rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          done
      - name: Verify installed standard-library launcher without starting LinuxCNC
        run: bash .github/ci/python-check.sh launcher

  appliance-checks:
    name: Python - Appliance maintenance policy (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/controller/requirements-ci.txt
      - name: Install pinned source-check tools
        run: python -m pip install -r app/controller/requirements-ci.txt
      - name: Check explicit provisioning and read-only maintenance interfaces
        run: |
          python -m ruff check tools/appliance
          python -m ruff format --check tools/appliance
          python -m unittest discover -s tools/appliance/tests -v

  config-checks:
    name: HAL/INI/Tcl - Machine configuration and connections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the Tcl syntax parser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl
      - name: Check configuration syntax and local file references without executing HAL
        run: |
          python3 -m unittest discover -s .github/ci/config-tests -v
          python3 .github/ci/check-configs.py

  rust-checks:
    name: Rust - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: tools/diagnostics
            name: Local diagnostics
          - module: app/platform/cam-link
            name: CAM integration
          - module: app/platform/updater
            name: Application updater
          - module: app/platform/mesa-update
            name: Mesa firmware checks and flash safeguards
          - module: app/platform/manage-ini
            name: PA maintenance terminal
          - module: app/platform/account-management/cnc-maint
            name: Maintenance account management
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the pinned Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - name: Create the isolated maintenance identity for PA process tests
        if: matrix.module == 'app/platform/manage-ini'
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin cnc-maint
      - name: Check library and Python protocol compatibility
        run: |
          cargo fmt --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          SERVICE_TEST_PYTHON=python3 cargo test --locked
      - name: Verify PA terminal input through a real pseudoterminal
        if: matrix.module == 'app/platform/manage-ini'
        run: |
          cargo build --locked --example terminal-preview
          PA_PREVIEW_BINARY="$PWD/target/debug/examples/terminal-preview" python3 tests/terminal_input.py

  qt-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: desktop
            name: Python - Qt desktop backend
          - suite: qml
            name: QML - Qt desktop interface
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the Qt container entry point
        run: |
          shellcheck app/desktop/scripts/ci-check.sh
          bash -n app/desktop/scripts/ci-check.sh
      - name: Check this Qt module in Debian 13
        env:
          QT_SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm --init --platform linux/amd64 \
            --env CI=true \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace \
            debian:13-slim \
            bash app/desktop/scripts/ci-check.sh --install-deps --suite "$QT_SUITE"
      - name: Upload Qt test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-qt-${{ matrix.suite }}-diagnostics
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  deb-package:
    name: Debian - Release package and permission validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify maintenance privilege drop under the packaged systemd sandbox
        run: python3 .github/ci/check-maintenance-units.py
      - name: Build and install the real application in an isolated Debian 13 container
        run: |
          mkdir -p release-artifacts
          docker run --rm --init --platform linux/amd64 \
            --env GITHUB_ACTIONS=true --env "BUILD_SHA=$GITHUB_SHA" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/release-artifacts,dst=/output" \
            --workdir /workspace debian:13-slim \
            bash .github/ci/deb-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: betterlinuxcnc-deb-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    # Preserve this exact check name for existing branch protection.
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      [
        source-checks,
        native-checks,
        mesa-homing,
        python-checks,
        launcher-checks,
        appliance-checks,
        preview-checks,
        config-checks,
        rust-checks,
        qt-build,
        deb-package,
      ]
    steps:
      - name: Require every language and module check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["NEEDS_JSON"])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          sys.exit(0 if results and all(
              job["result"] == "success" for job in results.values()
          ) else 1)
          PY
